<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PKCE flow</title>
  <desc id="desc">A client keeps a code verifier, sends its hash as a challenge, and later proves possession of the verifier when redeeming the code.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">PKCE binds the authorization code to its legitimate client</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="95" y="140" width="260" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="225" y="180" font-size="20" font-weight="700" fill="#1e3a8a">Client</text><text x="225" y="211" font-size="14" fill="#1e3a8a">keeps code_verifier</text><rect x="845" y="140" width="260" height="105" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="975" y="180" font-size="20" font-weight="700" fill="#166534">Authorization server</text><text x="975" y="211" font-size="14" fill="#166534">stores code_challenge</text></g>
  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M355 165 H845"/><path d="M845 235 H355"/><path d="M355 330 H845"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="16" fill="#1e3a8a"><text x="600" y="145">1. /authorize: code_challenge = BASE64URL(SHA-256(verifier))</text><text x="600" y="275">2. Redirect: one-time authorization code</text><text x="600" y="365">3. /token: authorization code + original code_verifier</text></g>
  <rect x="285" y="405" width="630" height="68" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/><text x="600" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6b21a8">Server recomputes the challenge</text><text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b21a8">Match → tokens. No verifier or mismatch → reject.</text>
</svg>
