<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">JWT validation pipeline</title>
  <desc id="desc">A resource server parses a token, selects a trusted key, verifies signature and claims, then applies local authorization.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">JWT validation: cryptography first, authorization last</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><g stroke-width="3"><rect x="35" y="190" width="150" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><rect x="225" y="190" width="170" height="90" rx="14" fill="#e0e7ff" stroke="#4f46e5"/><rect x="435" y="190" width="170" height="90" rx="14" fill="#f3e8ff" stroke="#7e22ce"/><rect x="645" y="190" width="170" height="90" rx="14" fill="#fef3c7" stroke="#b45309"/><rect x="855" y="190" width="170" height="90" rx="14" fill="#dcfce7" stroke="#15803d"/></g><g font-size="16" font-weight="700"><text x="110" y="225">Receive token</text><text x="110" y="250">Parse defensively</text><text x="310" y="225">Trusted key</text><text x="310" y="250">JWKS / cache</text><text x="520" y="225">Algorithm +</text><text x="520" y="250">signature verify</text><text x="730" y="225">Claims</text><text x="730" y="250">iss • aud • time</text><text x="940" y="225">Local policy</text><text x="940" y="250">scope • resource</text></g></g>
  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M185 235 H225"/><path d="M395 235 H435"/><path d="M605 235 H645"/><path d="M815 235 H855"/></g>
  <path d="M1025 235 H1125" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1120" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">Allow</text>
  <rect x="145" y="355" width="910" height="88" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#991b1b">Any failure: reject before trusting claims</text><text x="600" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">Never accept alg=none; never let a JWT header choose the trust policy.</text>
</svg>
