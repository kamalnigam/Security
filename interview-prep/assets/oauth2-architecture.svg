<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">OAuth 2.0 delegated authorization</title>
  <desc id="desc">A resource owner authorizes a client through an authorization server, then the client calls the resource server with an access token.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="480" fill="#f8fafc" rx="24"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">OAuth 2.0: delegated authorization</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e0f2fe" stroke="#0369a1" stroke-width="3"><rect x="55" y="170" width="190" height="100" rx="14"/><rect x="325" y="170" width="190" height="100" rx="14"/><rect x="685" y="170" width="210" height="100" rx="14"/><rect x="965" y="170" width="190" height="100" rx="14"/></g>
    <g fill="#0f172a" font-size="18" font-weight="700"><text x="150" y="212">Resource owner</text><text x="420" y="212">Client</text><text x="790" y="202">Authorization</text><text x="790" y="228">server</text><text x="1060" y="212">Resource server</text></g>
    <g fill="#475569" font-size="14"><text x="150" y="242">user / partner</text><text x="420" y="242">application</text><text x="790" y="252">identity + token issuer</text><text x="1060" y="242">protected API</text></g>
  </g>
  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M245 190 H325"/><path d="M515 190 H685"/><path d="M685 250 H515"/><path d="M515 310 H965"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle"><text x="285" y="150">1. Start authorization</text><text x="600" y="150">2. Authenticate + consent</text><text x="600" y="294">3. Authorization code</text><text x="740" y="345">4. Access token → API request</text></g>
  <path d="M420 270 V370 H790 V270" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="605" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5b21b6">Token endpoint: code + PKCE verifier → access token</text>
</svg>
